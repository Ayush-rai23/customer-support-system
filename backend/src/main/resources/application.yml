spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/support_system
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        index-type: hnsw
        distance-type: cosine_distance
        dimensions: 1536

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

app:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-only-secret-change-this-dev-only-secret}
    expiration-ms: 86400000
  admin:
    default-email: ${ADMIN_DEFAULT_EMAIL:admin@support.local}
    default-password: ${ADMIN_DEFAULT_PASSWORD:changeme}
  support-inbox-address: ${SUPPORT_INBOX_ADDRESS:support@example.com}
  ai:
    confidence-threshold: 0.75

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.support.backend: DEBUG
